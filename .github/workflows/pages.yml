name: Deploy to GitHub Pages

# Vitrine estática. Os JSON em public/data/ já estão no repositório.
# O Notion não é mais fonte: não há fetch, cron diário nem secrets NOTION_*.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_STATIC_DATA: "1"
          NEXT_PUBLIC_BASE_PATH: "/awq"
          NEXT_PUBLIC_APP_URL: "https://awq-brown.vercel.app"
          NEXT_PUBLIC_SUPABASE_URL: "https://kkhxxsrgsewjfvnnssyf.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtraHh4c3Jnc2V3amZ2bm5zc3lmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MjU5MDMsImV4cCI6MjA5NDIwMTkwM30.snYJ697SXGqcKc-I__w0kYMat71LbnusEjOdg27EOvs"
          # NEXT_PUBLIC_ANTHROPIC_API_KEY deliberately omitted:
          # NEXT_PUBLIC_* vars are inlined into the client JS bundle and are
          # publicly visible to anyone who inspects the static output.
          # AI features on GitHub Pages require the user to supply their own key.

      - name: Verify build output
        run: |
          echo "=== Build output check ==="
          if [ ! -d "./out" ]; then
            echo "ERROR: ./out directory not found — build likely failed silently"
            exit 1
          fi
          HTML_COUNT=$(find ./out -name "*.html" | wc -l)
          echo "HTML pages generated: $HTML_COUNT"
          if [ "$HTML_COUNT" -eq "0" ]; then
            echo "ERROR: no HTML pages found in ./out"
            exit 1
          fi
          echo "OK: build output verified"
          du -sh ./out

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847 # v3.9.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          keep_files: true
