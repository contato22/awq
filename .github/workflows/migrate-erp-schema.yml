name: Apply ERP Schema (Supabase)

# Ledger de migrações. Não reaplica o diretório.
#
# O dono precisa gravar o baseline UMA vez, na main, antes de qualquer migrate.
# Até lá o migrate recusa e não executa SQL. O push na main só faz dry-run.
#
# Actions → Apply ERP Schema → Run workflow (branch main):
#   1. mode=dry-run. Confira a lista. 001_initial_schema.sql tem de aparecer
#      bloqueado. _bootstrap_conciliacao_full.sql não entra.
#   2. mode=baseline, confirm=REGISTRAR_BASELINE_SEM_EXECUTAR.
#      Só grava nome e checksum. Não executa os arquivos.
#      Recusa se public.bank_transactions não existir.
#   3. mode=dry-run de novo. Tudo atual deve estar aplicado (source=baseline).
#   4. Daí em diante, mode=migrate e confirm=APLICAR_PENDENTES aplica só o
#      que ainda não está no ledger.
#
# Destrutivo (DROP TABLE, TRUNCATE, DELETE FROM, DROP COLUMN, …) só roda se
# o arquivo tiver a linha `-- erp-migrate: allow-destructive` E o input
# allow_destructive estiver marcado. 001 não tem essa linha.
#
# SUPABASE_DB_URL deve ser a conexão direta ou o pooler de sessão (porta 5432).
# O pooler de transação (porta 6543) não serve: cada arquivo roda numa transação
# com lock advisory preso a essa transação.
#
# Não disparar este workflow a partir de um agente.
# secrets não pode aparecer em steps.if. O gate do psql é steps.dburl.outputs.present.
# O job usa environment production e só roda em refs/heads/main.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (não escreve) | baseline (só registra) | migrate (aplica pendentes)"
        type: choice
        default: dry-run
        options:
          - dry-run
          - baseline
          - migrate
      confirm:
        description: "baseline: REGISTRAR_BASELINE_SEM_EXECUTAR | migrate: APLICAR_PENDENTES"
        type: string
        required: false
      allow_destructive:
        description: "Executa destrutivo só se o arquivo tiver -- erp-migrate: allow-destructive"
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - "awq_erp_full_schema.sql"
      - "supabase/migrations/**"

permissions:
  contents: read

jobs:
  migrate:
    name: ERP schema ledger
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.ref == 'refs/heads/main' && vars.SKIP_ERP_MIGRATE != 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secret present
        id: dburl
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "SUPABASE_DB_URL ausente. Os passos de banco serão ignorados neste push."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "SUPABASE_DB_URL presente. A URL não é impressa."
          fi

      - name: Exige secret para disparo manual
        if: steps.dburl.outputs.present != 'true' && github.event_name == 'workflow_dispatch'
        run: |
          echo "::error::SUPABASE_DB_URL ausente. Nada foi aplicado."
          exit 1

      - name: Setup Node.js
        if: steps.dburl.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install psql client
        if: steps.dburl.outputs.present == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Dry-run, baseline ou migrate
        if: steps.dburl.outputs.present == 'true'
        env:
          MIGRATE_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          MIGRATE_ALLOW_REMOTE: "1"
          MIGRATE_MODE: ${{ github.event_name == 'push' && 'dry-run' || inputs.mode }}
          MIGRATE_CONFIRM: ${{ inputs.confirm }}
          MIGRATE_ALLOW_DESTRUCTIVE: ${{ inputs.allow_destructive == true && '1' || '0' }}
        run: |
          set -euo pipefail
          mode="$MIGRATE_MODE"
          echo "Modo: $mode"
          if [ "$mode" = "baseline" ] && [ "$MIGRATE_CONFIRM" != "REGISTRAR_BASELINE_SEM_EXECUTAR" ]; then
            echo "::error::Baseline recusado. Digite exatamente REGISTRAR_BASELINE_SEM_EXECUTAR no input confirm."
            exit 2
          fi
          if [ "$mode" = "migrate" ] && [ "$MIGRATE_CONFIRM" != "APLICAR_PENDENTES" ]; then
            echo "::error::Migrate recusado. Digite exatamente APLICAR_PENDENTES no input confirm."
            exit 2
          fi
          args=(node scripts/erp-migrate.mjs "$mode")
          if [ -n "$MIGRATE_CONFIRM" ]; then
            args+=(--confirm "$MIGRATE_CONFIRM")
          fi
          if [ "$MIGRATE_ALLOW_DESTRUCTIVE" = "1" ]; then
            args+=(--allow-destructive)
          fi
          "${args[@]}"
