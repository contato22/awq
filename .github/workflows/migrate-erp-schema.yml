name: Apply ERP Schema (Supabase)

# ─── WHEN ─────────────────────────────────────────────────────────────────────
# Run manually via workflow_dispatch, or on a push to main that changes
# awq_erp_full_schema.sql or supabase/migrations/**.
#
# The job targets the GitHub Environment `production` (this repo already has
# an environment named Production, today with no required reviewers and no
# branch policy). After the owner adds a required reviewer, the job waits.
# Until then the environment does not block the run. Do not dispatch this
# workflow from an agent.
#
# Only refs/heads/main can run the job. A feature-branch dispatch must not
# apply SQL.
#
# REQUIRED GitHub Secret:
#   SUPABASE_DB_URL — Postgres connection string from Supabase dashboard:
#     Settings → Database → Connection string → URI (direct / pooler)
#     Example: postgresql://postgres.kkhxxsrgsewjfvnnssyf:[PASSWORD]@aws-0-xx.pooler.supabase.com:6543/postgres
#
# There is no schema_migrations ledger. The loop reapplies awq_erp_full_schema.sql
# and every file in supabase/migrations/ in lexical order, including
# 001_initial_schema.sql (DROP TABLE bank_transactions / financial_documents
# CASCADE) and _bootstrap_conciliacao_full.sql. That can destroy data.
# A ledger is not implemented here: production's apply history is unknown,
# and the first run would either repeat that DROP or skip files without
# evidence. See AGENTS.md.
#
# secrets is not a valid context in steps.if (GitHub rejects the file at
# parse time, which fails every push before path filters apply). The psql
# steps stay gated on the boolean output steps.dburl.outputs.present.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "awq_erp_full_schema.sql"
      - "supabase/migrations/**"

permissions:
  contents: read

jobs:
  migrate:
    name: Apply ERP Schema to Supabase
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.ref == 'refs/heads/main' && vars.SKIP_ERP_MIGRATE != 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check secret present
        id: dburl
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "SUPABASE_DB_URL secret not set — migration steps will be skipped."
            echo "Add it in: Settings → Secrets and variables → Actions → New repository secret"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "SUPABASE_DB_URL is set — migration steps will run."
          fi

      - name: Install psql client
        if: steps.dburl.outputs.present == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Apply ERP schema (idempotent)
        if: steps.dburl.outputs.present == 'true'
        run: |
          echo "Applying awq_erp_full_schema.sql …"
          psql "$SUPABASE_DB_URL" -f awq_erp_full_schema.sql -v ON_ERROR_STOP=1
          echo "✓ ERP schema applied successfully."
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Apply Supabase migrations (idempotent, ordered)
        if: steps.dburl.outputs.present == 'true'
        run: |
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "Applying $f …"
            psql "$SUPABASE_DB_URL" -f "$f" -v ON_ERROR_STOP=1
            echo "✓ $f applied."
          done
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Verify tables
        if: steps.dburl.outputs.present == 'true'
        run: |
          TABLES=$(psql "$SUPABASE_DB_URL" -t -c "
            SELECT tablename FROM pg_tables
            WHERE schemaname = 'public' AND tablename LIKE 'erp_%'
            ORDER BY tablename;
          ")
          echo "ERP tables present:"
          echo "$TABLES"
          COUNT=$(echo "$TABLES" | grep -c erp_ || true)
          echo "Total: $COUNT tables"
          if [ "$COUNT" -lt 7 ]; then
            echo "FAIL: expected at least 7 ERP tables, found $COUNT"
            exit 1
          fi
          echo "✓ Schema verification passed."
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
