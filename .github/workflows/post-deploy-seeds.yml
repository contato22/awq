name: Post-Deploy Seeds (Jun 2026)

# Manual only. A push to main must not POST seeds to production.
# The job uses the GitHub Environment `production`. It waits for a reviewer
# only after the owner configures one on that environment. Dispatch from a
# branch other than main is skipped.
#
# Auth: Authorization: Bearer $PROBE_SECRET (GitHub Secret + Vercel env).
# A rota não aceita mais a anon key como senha.
#
# HTTP diferente de 200 emite WARN e não falha o job — risco residual.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    name: Seed BTG + Itaú Jun 2026
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - name: Seed BTG Jun 2026 (08–10/06)
        id: seed_btg
        env:
          PROBE_SECRET: ${{ secrets.PROBE_SECRET }}
        run: |
          if [ -z "$PROBE_SECRET" ]; then
            echo "Secret PROBE_SECRET ausente."
            exit 1
          fi
          RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 30 \
            -X POST https://awq-brown.vercel.app/api/setup/seed-btg-extract-jun2026 \
            -H "Authorization: Bearer $PROBE_SECRET" \
            -H "Content-Type: application/json")
          BODY=$(echo "$RESPONSE" | head -n -1)
          STATUS=$(echo "$RESPONSE" | tail -n 1)
          echo "btg_status=$STATUS" >> $GITHUB_OUTPUT
          echo "btg_body=$BODY" >> $GITHUB_OUTPUT
          echo "HTTP $STATUS — $BODY"
          if [ "$STATUS" != "200" ]; then
            echo "WARN: BTG seed returned $STATUS"
          fi

      - name: Seed Itaú Jun 2026 (02/06)
        id: seed_itau
        env:
          PROBE_SECRET: ${{ secrets.PROBE_SECRET }}
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 30 \
            -X POST https://awq-brown.vercel.app/api/setup/seed-itau-extract-jun2026 \
            -H "Authorization: Bearer $PROBE_SECRET" \
            -H "Content-Type: application/json")
          BODY=$(echo "$RESPONSE" | head -n -1)
          STATUS=$(echo "$RESPONSE" | tail -n 1)
          echo "itau_status=$STATUS" >> $GITHUB_OUTPUT
          echo "itau_body=$BODY" >> $GITHUB_OUTPUT
          echo "HTTP $STATUS — $BODY"
          if [ "$STATUS" != "200" ]; then
            echo "WARN: Itaú seed returned $STATUS"
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Post-Deploy Seeds" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Seed | HTTP | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| BTG Jun 2026 | ${{ steps.seed_btg.outputs.btg_status }} | ${{ steps.seed_btg.outputs.btg_body }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Itaú Jun 2026 | ${{ steps.seed_itau.outputs.itau_status }} | ${{ steps.seed_itau.outputs.itau_body }} |" >> $GITHUB_STEP_SUMMARY
