name: EPM Planning — Seed + Test (Supabase)

# ─── WHEN ─────────────────────────────────────────────────────────────────────
# Manual dispatch, or a push to main that changes the EPM paths below.
# The old claude/* branch trigger was removed.
#
# The job uses the GitHub Environment `production` and only runs from
# refs/heads/main. It writes to the Supabase database named by
# SUPABASE_DB_URL. Do not dispatch it from an agent.
#
# If SUPABASE_DB_URL is missing, or the live seed/tests fail, the job fails.
# It does not re-run the static fallback to turn a database failure green.
#
# REQUIRED GitHub Secrets:
#   SUPABASE_DB_URL          — Postgres direct connection string
#   SUPABASE_SERVICE_ROLE_KEY — Service role JWT (bypasses RLS)
#
# OPTIONAL:
#   NEXT_PUBLIC_SUPABASE_ANON_KEY — Anon JWT (for client-side modules)
#
# The seed is idempotent (CREATE TABLE IF NOT EXISTS + ON CONFLICT DO UPDATE).

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "lib/epm-planning-db.ts"
      - "lib/db.ts"
      - "lib/supabase.ts"
      - "lib/financial-db.ts"
      - "lib/ppm-db.ts"
      - "lib/advisor-db.ts"
      - "lib/ma-db.ts"
      - "lib/caza-crm-db.ts"
      - "lib/crm-db.ts"
      - "lib/bpm-db.ts"
      - "lib/ap-ar-db.ts"
      - "scripts/seed-epm-planning.ts"
      - "scripts/test-epm-db.ts"
      - "app/api/epm/planning/**"
      - ".github/workflows/epm-seed-and-test.yml"

permissions:
  contents: read

jobs:
  seed-and-test:
    name: Seed EPM tables + run read/write tests
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      # seed:epm e test:epm chamam o binário `tsx` (devDependency).
      # `npm ci` coloca esse binário no PATH.
      - name: Install dependencies
        run: npm ci

      - name: Seed EPM tables (idempotente)
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::SUPABASE_DB_URL não está configurado. O job não passa no fallback estático."
            exit 1
          fi
          echo "DATABASE_URL disponível — seedando tabelas EPM..."
          npm run seed:epm
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Run EPM read/write tests
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::SUPABASE_DB_URL não está configurado. Testes contra o banco não rodaram."
            exit 1
          fi
          echo "DATABASE_URL disponível — rodando testes com live DB..."
          npm run test:epm
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: https://gqkgsoglgubmaborixfb.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: https://gqkgsoglgubmaborixfb.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Summary
        if: always()
        run: |
          echo "## EPM Supabase — Seed + Test" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Etapa | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Tabelas criadas (idempotente) | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dados seedados | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Testes read/write | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Supabase**: https://gqkgsoglgubmaborixfb.supabase.co" >> $GITHUB_STEP_SUMMARY
